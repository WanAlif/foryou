<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>for you wihuuu</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #ffb3c6;
    --pink-dark: #ff85a1;
    --pink-light: #ffe0ea;
    --lavender: #d4b8e0;
    --lavender-light: #ede4f5;
    --blue: #b8d8f0;
    --blue-light: #dff0fc;
    --cream: #fff9f0;
    --text: #6b4f6b;
    --text-light: #b08bb0;
    --white: #ffffff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--cream);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* ── Mesh background ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 20%, #ffd6e8 0%, transparent 50%),
      radial-gradient(ellipse at 75% 10%, #e8d6f5 0%, transparent 45%),
      radial-gradient(ellipse at 40% 80%, #d6ecff 0%, transparent 50%),
      radial-gradient(ellipse at 90% 90%, #ffecd6 0%, transparent 50%),
      var(--cream);
    z-index: 0;
  }

  /* ── Floating deco particles ── */
  .deco {
    position: fixed;
    pointer-events: none;
    z-index: 1;
    font-size: 1.4rem;
    animation: floatDeco linear infinite;
    opacity: 0.55;
  }
  @keyframes floatDeco {
    0%   { transform: translateY(110vh) rotate(0deg);   opacity: 0; }
    10%  { opacity: 0.55; }
    90%  { opacity: 0.55; }
    100% { transform: translateY(-15vh) rotate(360deg); opacity: 0; }
  }

  /* ── Page wrapper ── */
  #app {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }

  /* ── Card ── */
  .card {
    background: rgba(255,255,255,0.72);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 2px solid rgba(255,179,198,0.45);
    border-radius: 2.8rem;
    padding: 3rem 2.5rem;
    max-width: 500px;
    width: 100%;
    text-align: center;
    box-shadow:
      0 8px 40px rgba(255,133,161,0.18),
      0 2px 8px rgba(255,133,161,0.1),
      inset 0 1px 0 rgba(255,255,255,0.9);
    animation: cardIn 0.7s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(30px) scale(0.93); }
    to   { opacity: 1; transform: translateY(0)   scale(1); }
  }

  /* ── Decorative top bar ── */
  .card-stripe {
    height: 6px;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--pink), var(--lavender), var(--blue), var(--pink));
    background-size: 200% 100%;
    animation: stripeShift 4s linear infinite;
    margin-bottom: 2rem;
  }
  @keyframes stripeShift { to { background-position: 200% 0; } }

  /* ── Landing ── */
  .landing-emoji {
    font-size: 4rem;
    line-height: 1;
    animation: pulse 2.4s ease-in-out infinite;
    display: block;
    margin-bottom: 1rem;
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); }
    50%      { transform: scale(1.12); }
  }

  .landing-title {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(1.5rem, 5vw, 2.1rem);
    color: var(--text);
    line-height: 1.35;
    margin-bottom: 0.6rem;
  }

  .landing-sub {
    color: var(--text-light);
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 2.2rem;
    letter-spacing: 0.01em;
  }

  /* ── Buttons ── */
  .btn {
    display: inline-block;
    font-family: 'Fredoka One', cursive;
    font-size: 1.2rem;
    letter-spacing: 0.03em;
    color: white;
    background: linear-gradient(135deg, var(--pink-dark) 0%, var(--lavender) 100%);
    border: none;
    border-radius: 99px;
    padding: 0.85rem 2.5rem;
    cursor: pointer;
    box-shadow: 0 4px 18px rgba(255,133,161,0.38), 0 2px 6px rgba(0,0,0,0.06);
    transition: transform 0.18s cubic-bezier(.34,1.56,.64,1), box-shadow 0.18s ease;
    text-shadow: 0 1px 4px rgba(0,0,0,0.12);
    position: relative;
    overflow: hidden;
  }
  .btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.25), transparent);
    border-radius: inherit;
  }
  .btn:hover  { transform: scale(1.07) translateY(-2px); box-shadow: 0 8px 28px rgba(255,133,161,0.48); }
  .btn:active { transform: scale(0.97); }

  /* ── Q&A ── */
  .q-counter {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--text-light);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 0.9rem;
  }

  .progress-bar {
    height: 6px;
    background: rgba(255,179,198,0.3);
    border-radius: 99px;
    overflow: hidden;
    margin-bottom: 2rem;
  }
  .progress-fill {
    height: 100%;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--pink-dark), var(--lavender));
    transition: width 0.5s cubic-bezier(.34,1.56,.64,1);
  }

  .question-text {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(1.3rem, 4.5vw, 1.75rem);
    color: var(--text);
    margin-bottom: 1.8rem;
    line-height: 1.3;
  }

  .answers {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  .ans-btn {
    background: rgba(255,255,255,0.85);
    border: 2px solid rgba(255,179,198,0.5);
    border-radius: 1.5rem;
    padding: 0.85rem 1.4rem;
    font-family: 'Nunito', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    color: var(--text);
    cursor: pointer;
    transition:
      transform 0.2s cubic-bezier(.34,1.56,.64,1),
      background 0.2s ease,
      border-color 0.2s ease,
      box-shadow 0.2s ease;
    text-align: left;
    position: relative;
    overflow: hidden;
  }
  .ans-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, var(--pink-light), var(--lavender-light));
    opacity: 0;
    transition: opacity 0.2s ease;
    border-radius: inherit;
  }
  .ans-btn:hover {
    transform: scale(1.035) translateX(4px);
    border-color: var(--pink-dark);
    box-shadow: 0 4px 18px rgba(255,133,161,0.25);
  }
  .ans-btn:hover::before { opacity: 1; }
  .ans-btn span { position: relative; z-index: 1; }

  .ans-btn.chosen {
    background: linear-gradient(135deg, var(--pink-light), var(--lavender-light));
    border-color: var(--pink-dark);
    transform: scale(0.97);
    pointer-events: none;
  }

  /* ── Final Page ── */
  .final-photo {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    margin: 0 auto 1.5rem;
    background: linear-gradient(135deg, var(--pink-light), var(--lavender-light), var(--blue-light));
    border: 4px solid var(--pink);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 4rem;
    box-shadow: 0 6px 24px rgba(255,133,161,0.3);
    animation: photoFloat 3s ease-in-out infinite;
  }
  @keyframes photoFloat {
    0%,100% { transform: translateY(0); }
    50%      { transform: translateY(-8px); }
  }

  .final-title {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(1.5rem, 5vw, 2rem);
    color: var(--text);
    margin-bottom: 0.9rem;
    line-height: 1.3;
  }

  .final-label {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(1.3rem, 4.5vw, 1.75rem);
    background: linear-gradient(135deg, var(--pink-dark), var(--lavender));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 0.9rem;
    line-height: 1.3;
  }

  .final-msg {
    color: var(--text-light);
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.6;
    margin-bottom: 2rem;
  }

  /* Floating hearts on final page */
  .heart-burst { position: fixed; inset: 0; pointer-events: none; z-index: 999; }
  .burst-heart {
    position: absolute;
    font-size: 1.6rem;
    animation: burstUp 2.8s ease-out forwards;
    opacity: 0;
  }
  @keyframes burstUp {
    0%   { opacity: 1;  transform: translateY(0) scale(0.5) rotate(0deg); }
    70%  { opacity: 0.9; }
    100% { opacity: 0;  transform: translateY(-80vh) scale(1.1) rotate(var(--r)); }
  }

  /* ── Page transitions ── */
  .page { animation: pageIn 0.55s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes pageIn {
    from { opacity: 0; transform: scale(0.9) translateY(20px); }
    to   { opacity: 1; transform: scale(1)   translateY(0); }
  }
  .page-out {
    animation: pageOut 0.3s ease forwards;
  }
  @keyframes pageOut {
    to { opacity: 0; transform: scale(0.88) translateY(-10px); }
  }

  /* ── Shimmer on card hover ── */
  .card:hover { box-shadow: 0 12px 50px rgba(255,133,161,0.22), 0 2px 8px rgba(255,133,161,0.1); }
</style>
</head>
<body>

<div id="app"></div>
<div class="heart-burst" id="heartBurst"></div>

<script>
const questions = [
  {
    q: "what kind of pretty are you? 🌸",
    answers: ["pretty crazyy 😜","super prettyy 💕","absolute divine ✨","all of it 😌"]
  },
  {
    q: "what's your vibe today?",
    answers: ["soft and cozyy 🧸","confident queeen 👑","sleepyy but cute 😴","chaotic but lovablee 😆"]
  },
  {
    q: "pick your energy ✨",
    answers: ["sunshinee ☀️","moonlightt 🌙","sparklees ✨","rainbow 🌈"]
  },
  {
    q: "how do people see you? 💖",
    answers: ["adorablee 🐻","stunniing 😍","sweett 🧁","all of the above 💖"]
  }
];

const DECO = ["💕","✨","🌸","⭐","💫","🌙","🦋","🌷","💝","🎀"];
let current = 0;
let transitioning = false;

/* ── Floating background particles ── */
function spawnDeco() {
  const d = document.createElement('div');
  d.className = 'deco';
  d.textContent = DECO[Math.floor(Math.random() * DECO.length)];
  d.style.left = Math.random() * 100 + 'vw';
  const dur = 8 + Math.random() * 10;
  d.style.animationDuration = dur + 's';
  d.style.animationDelay = '0s';
  d.style.fontSize = (0.9 + Math.random() * 1.4) + 'rem';
  document.body.appendChild(d);
  setTimeout(() => d.remove(), dur * 1000 + 500);
}
setInterval(spawnDeco, 900);
for (let i = 0; i < 6; i++) setTimeout(spawnDeco, i * 300);

/* ── Render ── */
const app = document.getElementById('app');

function renderLanding() {
  app.innerHTML = `
    <div class="card page" id="mainCard">
      <div class="card-stripe"></div>
      <span class="landing-emoji">💖</span>
      <h1 class="landing-title">this is for pretty, kind &amp; beautiful like you :3</h1>
      <p class="landing-sub">a little something just for you ✨</p>
      <button class="btn" onclick="startQuiz()">start 💕</button>
    </div>`;
}

function renderQuestion(idx) {
  const q = questions[idx];
  const progress = ((idx) / questions.length) * 100;
  app.innerHTML = `
    <div class="card page" id="mainCard">
      <div class="card-stripe"></div>
      <p class="q-counter">question ${idx+1} of ${questions.length}</p>
      <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
      <p class="question-text">${q.q}</p>
      <div class="answers">
        ${q.answers.map((a,i) =>
          `<button class="ans-btn" onclick="pickAnswer(this,${i})"><span>${a}</span></button>`
        ).join('')}
      </div>
    </div>`;
  /* Animate progress fill in */
  requestAnimationFrame(() => {
    const fill = document.querySelector('.progress-fill');
    if (fill) fill.style.width = ((idx+1)/questions.length*100) + '%';
  });
}

const finalMessages = [
  {
    title: "a certified main character ✨",
    msg: "the universe literally wrote the plot around you.<br>everyone else is just a supporting role, bestie. 🎬💕",
    emoji: "🌟"
  },
  {
    title: "dangerously cute & you know it 🐾",
    msg: "scientists have tried to study you but kept getting distracted.<br>it's just not fair how adorable you are. 🧪💖",
    emoji: "🎀"
  },
  {
    title: "softest person alive 🧸",
    msg: "warm hugs, cozy vibes, and the sweetest heart in the room.<br>people feel safe just being near you. 🌷✨",
    emoji: "🧸"
  },
  {
    title: "walking, talking serotonin 💛",
    msg: "you show up and suddenly everything is better.<br>that's not luck — that's just you being you. ☀️💕",
    emoji: "☀️"
  },
  {
    title: "rare & limited edition 💎",
    msg: "they broke the mold after making you.<br>genuinely one-of-one. the world got lucky. 🌸✨",
    emoji: "💎"
  },
  {
    title: "glowing like you own the moon 🌙",
    msg: "there's a light around you that no filter could ever capture.<br>it just comes from within. naturally stunning. 🌙💖",
    emoji: "🌙"
  },
  {
    title: "too pretty for this world 🌺",
    msg: "flowers look at you for inspiration.<br>butterflies follow you around on purpose. 🦋🌸",
    emoji: "🌺"
  },
  {
    title: "the sweetest soul in the room 🍓",
    msg: "kind eyes, warm laugh, gentle heart —<br>you make everything taste a little sweeter. 🍓💝",
    emoji: "🍓"
  },
  {
    title: "chaos wrapped in cuteness 🌈",
    msg: "a little unpredictable, a little silly, 100% lovable.<br>nobody does 'wonderfully unhinged' quite like you. 🌈💕",
    emoji: "🌈"
  },
  {
    title: "the dream, literally 💭",
    msg: "people hear your name and immediately smile.<br>that's the effect. that's just your power. 💫💖",
    emoji: "💭"
  }
];

function renderFinal() {
  const pick = finalMessages[Math.floor(Math.random() * finalMessages.length)];
  app.innerHTML = `
    <div class="card page" id="mainCard">
      <div class="card-stripe"></div>
      <div class="final-photo">${pick.emoji}</div>
      <h2 class="final-title">based on your answers…<br>you are:</h2>
      <p class="final-label">${pick.title}</p>
      <p class="final-msg">${pick.msg}</p>
      <button class="btn" onclick="restart()">restart 💕</button>
    </div>`;
  burstHearts();
}

/* ── Actions ── */
function startQuiz() {
  current = 0;
  transitionTo(() => renderQuestion(0));
}

function pickAnswer(btn, idx) {
  if (transitioning) return;
  btn.classList.add('chosen');
  current++;
  setTimeout(() => {
    if (current >= questions.length) transitionTo(renderFinal);
    else transitionTo(() => renderQuestion(current));
  }, 420);
}

function restart() {
  document.getElementById('heartBurst').innerHTML = '';
  current = 0;
  transitionTo(renderLanding);
}

function transitionTo(renderFn) {
  transitioning = true;
  const card = document.getElementById('mainCard');
  if (card) {
    card.classList.add('page-out');
    setTimeout(() => { renderFn(); transitioning = false; }, 320);
  } else {
    renderFn();
    transitioning = false;
  }
}

/* ── Heart burst on final page ── */
function burstHearts() {
  const container = document.getElementById('heartBurst');
  container.innerHTML = '';
  const EMOJIS = ['💖','💕','✨','🌸','💝','💗','⭐','🌷'];
  function launch() {
    const h = document.createElement('div');
    h.className = 'burst-heart';
    h.textContent = EMOJIS[Math.floor(Math.random()*EMOJIS.length)];
    h.style.left = (5 + Math.random()*90) + 'vw';
    h.style.bottom = '-3rem';
    h.style.setProperty('--r', (Math.random()*40-20)+'deg');
    h.style.animationDuration = (2 + Math.random()*2) + 's';
    h.style.animationDelay = (Math.random()*2.5) + 's';
    h.style.fontSize = (1.2 + Math.random()*1.5) + 'rem';
    container.appendChild(h);
    setTimeout(() => h.remove(), 5500);
  }
  for (let i = 0; i < 28; i++) setTimeout(launch, i * 120);
  setTimeout(() => {
    for (let i = 0; i < 14; i++) setTimeout(launch, i * 200);
  }, 3500);
}

/* ── Init ── */
renderLanding();
</script>
</body>
</html>
